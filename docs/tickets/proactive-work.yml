epics:
  - key: epic
    issue: 6
    title: 余剰トークンで指示なしに採用される保守成果を定期的に得る
    body: |
      ## 解決する課題
      Claude Code の定額枠が余って消えている一方、放置物(未コミット変更・未push・残骸ブランチ)、
      発動条件を満たしたまま気づかれない保留判断、着手前の下調べといった「誰も指示しないが価値のある作業」が手作業のまま溜まっている。
      希少なのはトークンではなく人のレビュー注意であり、行動回数ではなく採用された成果で測る必要がある。

      先行調査: docs/research/2026-09-23-proactive-agent-work.md(判定: 部分自作。起動と作業本体は既存、自前は価値ゲート層のみ)

      ## 成功指標
      初期3ジョブのダイジェストで、提案の採用率が 50% 以上で推移し、その採用率が台帳から読める。

      ## スコープ外
      常駐AI指揮官(aquarium で実現不能と確定済み)、自動マージ、ホットスポット外の全域リファクタ。

      ## 保留(着手条件つき)
      - 採用率の低いジョブ種別の自動停止 — 採否台帳が2週分以上たまったら
      - バックログ整理 — backlog-steward を GitHub Issues 版に改修したら
      - ドキュメント/指示のずれ検出、エントロピー低減、セキュリティ、ダブルチェック、メタ検討、最新動向、インフラ健全性、バックアップ復元テスト、スキル発火監査、トークン使用の振り返り — 初期3ジョブの採用率が出てから上位から追加
    children:
      - key: s1
        issue: 7
        title: Git の後片付け候補を週次ダイジェストで受け取り採否を返せる
        body: |
          ## ユーザーストーリー
          複数セッションで作業する開発者として、各リポジトリの未コミット変更・未push・main直コミット・マージ済み残骸ブランチ・古い worktree を毎週1枚で知りたい。なぜなら他セッションの残骸が main に溜まっても誰も気づかないから。

          ## 受入条件
          - [ ] 週1回、人の指示なしにダイジェストが1本だけ出る(個別の PR やコメントを乱発しない)
          - [ ] 各提案に採否を返すと台帳に記録され、ジョブ種別ごとの採用率が読める
          - [ ] 書き込み操作(削除・push・commit)は一切自動実行されず、提案に留まる
          - [ ] 1回の実行に予算上限があり、ANTHROPIC_API_KEY が設定されている環境では実行を拒否する
          - [ ] 何も見つからない週は「該当なし」で終わり、水増しの提案を出さない
        children:
          - key: t1a
            issue: 8
            title: Git 後片付けジョブを価値ゲート付きスキルとして作る
            body: |
              ## やること
              read-only で後片付け候補を集め、1本のダイジェストと採否台帳を出す proactive-work スキルを、最初のジョブ(Git 後片付け)込みで作る。ジョブを後から足せる形にする。

              ## 完了条件
              - [ ] 手動起動で実リポジトリ群に対しダイジェストが出て、採否が台帳に残る
          - key: t1b
            issue: 9
            title: proactive-work を週次で無人実行されるようにする
            body: |
              ## やること
              proactive-work を週1回、人の起動なしに走らせる。対象リポジトリが実在するホストで動かし、安価モデル指定が実際に効いたことを実行記録に残す。

              ## 完了条件
              - [ ] 無人実行が1回成功し、使ったモデルと消費量が記録に残っている
      - key: s2
        issue: 10
        title: 保留判断の発動条件が満たされたことをダイジェストで知れる
        body: |
          ## ユーザーストーリー
          判断を「〜が起きたら着手」と保留してきた者として、その条件が満たされたら知らされたい。なぜなら今は条件が起きても誰も見ていないから(例: aquarium の pueue 化トリガー)。

          ## 受入条件
          - [ ] メモリと issue に書かれた「将来/トリガー待ち」の条件が一覧化され、成立したものだけがダイジェストに載る
          - [ ] 成立判定には観測した事実(ファイル・メトリクス・issue)の出典が付く
          - [ ] 判定できない条件は「判定不能」として分けて出し、成立扱いにしない
        children:
          - key: t2
            issue: 11
            title: 保留判断の発動条件チェックを proactive-work のジョブに加える
            body: |
              ## やること
              メモリと issue の保留判断から発動条件を拾い、成立したものをダイジェストに載せるジョブを加える。

              ## 完了条件
              - [ ] 実データで1回走り、各条件に成立/不成立/判定不能と出典が付いたダイジェストが出る
      - key: s3
        issue: 12
        title: 着手予定の issue に先回り調査が付いた状態で作業を始められる
        body: |
          ## ユーザーストーリー
          次に着手する開発者として、Ready の issue に関連コードの地図と先行調査が既に付いていてほしい。なぜなら着手のたびに同じ下調べを最初からやっているから。

          ## 受入条件
          - [ ] Project の Ready 列の issue に、関連ファイル・既存物・先行事例(出典つき)がコメントされる
          - [ ] 1 issue につき1回だけ付き、既に付いた issue には重ねない
          - [ ] 調査が浅い(出典なし)ものは投稿しない
        children:
          - key: t3
